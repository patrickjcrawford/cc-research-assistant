project:
  title: "[PROJECT TITLE]"
  execute-dir: project
  output-dir: _output
  render:
    - paper/main.qmd   # only render the manuscript; keeps `quarto render` from walking stray .md/.qmd files

title: "[PAPER TITLE]"
subtitle: "[SUBTITLE]"
author:
  - name: "[AUTHOR NAME]"
    email: "[EMAIL]"
    affiliation:
      - primary
shortauthor: "[LAST NAME]"
affiliations:
  - id: primary
    name: "[UNIVERSITY]"
    department: "[DEPARTMENT]"
    address: "[CITY, STATE]"
institute: "[UNIVERSITY]"
shortinstitute: "[ABBREV]"
date: today
date-format: long
# newest-version: "https://..."   # optional: renders a "most recent version" link below the date, above the abstract

tbl-cap-location: top

citeproc: true
bibliography: references.bib
csl: https://www.zotero.org/styles/apa

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

pandoc:
  wrap: none

format:
  pdf:
    documentclass: article
    pdf-engine: xelatex
    toc: false
    papersize: letter
    fontsize: 10pt
    geometry: margin=1in
    indent: true
    link-citations: true
    fig-height: 4
    fig-width: 7.5
    fig-pos: "!t"
    keep-tex: false
    # output-file: Lastname_[repo].pdf   # optional: stable PDF name for a personal website (pair with newest-version)
    linkcolor: medium-green-grey
    citecolor: medium-green-grey
    urlcolor: medium-green-grey
    number-sections: true
    include-in-header: paper/preambles/draft-article/article-header.tex   # loads setspace, sets \doublespacing
    template-partials:
      - paper/preambles/draft-article/title.tex
      - paper/preambles/draft-article/before-body.tex

  beamer:
    navigation: horizontal
    keep-tex: true
    incremental: true
    link-citations: true
    linkcolor: bg-green-grey
    urlcolor: medium-green-grey
    section-titles: false
    fonttheme: structurebold
    aspectratio: 169
    include-in-header: paper/preambles/beamer/slides-header.tex
